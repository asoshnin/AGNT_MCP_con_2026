id: pipe-agntcon-final-e2e-verification-v1
name: AGNTCon 2026 Final Comprehensive Verification and Production Certification
version: "1.0.0"
status: canonical
domain: cloud_platform
tags:
  - agntcon
  - verification
  - production
  - multi_cloud
  - e2e
  - mcp
required_inputs:
  - site/index.html
  - serve.py
  - crm_db.py
target_deliverables:
  - out/FINAL_TESTING_CERTIFICATION.md
description: >
  Comprehensive Kahn DAG verification pipeline for AGNTCon + MCPCon Europe 2026 Hub.
  Executes unit tests, multi-cloud production health checks, E2E CRM and contribution workflows,
  cleanups, and compiles a final production certification report.
budget_limit_usd: 0.50
timeout_seconds: 600
circuit_breakers:
  max_consecutive_errors: 2
  abort_on_degradation: true
stages:
  - id: stage_01_codebase_and_ci
    name: Codebase, Deterministic Quality Gates & CI
    type: single_pass
    depends_on: []
    inputs:
      - site/index.html
      - serve.py
      - crm_db.py
    outputs:
      - out/stage_01_ci_results.json
    role: qa_lead
    skill: test-suite-architect
    tools_allow:
      - read
      - write
      - exec
    sandbox_policy: inherit

  - id: stage_02_production_health
    name: Multi-Cloud Production Health & Service Audit
    type: single_pass
    depends_on: []
    inputs:
      - site/index.html
      - serve.py
    outputs:
      - out/stage_02_prod_results.json
    role: sre_engineer
    skill: diagnose-gateway
    tools_allow:
      - read
      - write
      - exec
    sandbox_policy: inherit

  - id: stage_03_e2e_features
    name: E2E API Workflows, CRM, Feedback & MCP Server
    type: single_pass
    depends_on:
      - stage_01_codebase_and_ci
      - stage_02_production_health
    inputs:
      - out/stage_01_ci_results.json
      - out/stage_02_prod_results.json
    outputs:
      - out/stage_03_e2e_results.json
    role: system_architect
    skill: vwoosh-pipeline-engine
    tools_allow:
      - read
      - write
      - exec
    sandbox_policy: inherit

  - id: stage_04_cleanup_and_purge
    name: Test Artifact Cleanup & Zero-PII Audit
    type: single_pass
    depends_on:
      - stage_03_e2e_features
    inputs:
      - out/stage_03_e2e_results.json
    outputs:
      - out/stage_04_cleanup_results.json
    role: security_auditor
    skill: secure-code-review
    tools_allow:
      - read
      - write
      - exec
    sandbox_policy: inherit

  - id: stage_05_final_synthesis
    name: Production Readiness Certification & Scorecard
    type: single_pass
    depends_on:
      - stage_04_cleanup_and_purge
    inputs:
      - out/stage_01_ci_results.json
      - out/stage_02_prod_results.json
      - out/stage_03_e2e_results.json
      - out/stage_04_cleanup_results.json
    outputs:
      - out/FINAL_TESTING_CERTIFICATION.md
    role: delivery_architect
    skill: vwoosh-autonomous-doc-factory
    tools_allow:
      - read
      - write
    sandbox_policy: inherit
