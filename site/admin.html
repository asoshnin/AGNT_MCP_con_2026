<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToyProjects CRM — AGNTCon 2026</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body { background: var(--bg-primary); color: var(--text-primary); font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    .crm-nav { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .crm-layout { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 60px); }
    @media (max-width: 768px) { .crm-layout { grid-template-columns: 1fr; } .crm-thread-pane { display: none; } .crm-thread-pane.active { display: flex; } }
    .crm-sidebar { border-right: 1px solid var(--border); overflow-y: auto; background: var(--card-bg); display: flex; flex-direction: column; }
    .crm-inbox-header { padding: 16px; border-bottom: 1px solid var(--border); }
    .crm-tabs { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; }
    .crm-tab { font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
    .crm-tab.active { background: var(--accent); color: #0b0f19; font-weight: 600; border-color: var(--accent); }
    .crm-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
    .crm-card { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
    .crm-card:hover { background: var(--bg-secondary); }
    .crm-card.selected { background: rgba(56, 189, 248, 0.08); border-left: 3px solid var(--accent); }
    .crm-card-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .crm-card-meta { font-size: 0.78rem; color: var(--text-secondary); display: flex; gap: 8px; align-items: center; }
    .crm-thread-pane { display: flex; flex-direction: column; background: var(--bg-primary); height: 100%; overflow: hidden; }
    .crm-thread-header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; }
    .crm-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; font-size: 0.9rem; }
    .msg-client { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--border); }
    .msg-admin { align-self: flex-end; background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.4); }
    .msg-note { align-self: center; background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.4); width: 90%; font-size: 0.85rem; color: #eab308; }
    .crm-composer { padding: 16px 24px; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .login-box { max-width: 360px; margin: 100px auto; padding: 32px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; text-align: center; }

    /* Operator Analytics Console Styling */
    .admin-nav-tabs { display: flex; gap: 8px; align-items: center; }
    .admin-nav-tab { font-size: 0.82rem; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-secondary); cursor: pointer; font-weight: 500; transition: all 0.15s ease; }
    .admin-nav-tab:hover { color: var(--text-primary); border-color: var(--accent); }
    .admin-nav-tab.active { background: var(--accent); color: #0b0f19; font-weight: 700; border-color: var(--accent); }

    .analytics-view { padding: 24px; max-width: 1300px; margin: 0 auto; overflow-y: auto; height: calc(100vh - 60px); box-sizing: border-box; }
    .analytics-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .kpi-label { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .kpi-value { font-size: 1.85rem; font-weight: 700; color: var(--accent); margin: 8px 0 4px 0; }
    .kpi-sub { font-size: 0.78rem; color: var(--text-secondary); }

    .analytics-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 900px) { .analytics-grid-2 { grid-template-columns: 1fr; } }
    .analytics-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .panel-title { font-size: 0.95rem; font-weight: 700; margin: 0 0 16px 0; display: flex; justify-content: space-between; align-items: center; }

    .funnel-step { margin-bottom: 14px; }
    .funnel-meta { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
    .funnel-bar-bg { background: var(--bg-secondary); border-radius: 6px; height: 16px; overflow: hidden; }
    .funnel-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #0284c7, #38bdf8); transition: width 0.4s ease; }

    .geo-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .geo-table th { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; }
    .geo-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
    .geo-bar-wrap { width: 100%; background: var(--bg-secondary); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .geo-bar { height: 100%; background: var(--accent); border-radius: 3px; }

    .histogram-wrap { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 15px; border-bottom: 1px solid var(--border); }
    .hist-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
    .hist-bar { width: 100%; background: rgba(56, 189, 248, 0.45); border-radius: 3px 3px 0 0; min-height: 2px; transition: background 0.2s, height 0.3s; }
    .hist-bar:hover { background: var(--accent); }
    .hist-label { font-size: 0.62rem; color: var(--text-secondary); margin-top: 6px; text-align: center; }
  </style>
</head>
<body>

  <div id="login-section" class="login-box">
    <h2 style="margin-top: 0;">🔒 ToyProjects CRM</h2>
    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 20px;">
      Operator Access for <strong>AGNTCon EU 2026</strong>
    </p>
    <form id="admin-login-form" style="display: flex; flex-direction: column; gap: 12px;">
      <input type="password" id="admin-pass" class="search-input" placeholder="Enter Operator Password" style="padding: 10px 14px;" required>
      <button type="submit" class="btn-header" style="background: var(--accent); color: #0b0f19; font-weight: 600; padding: 10px;">
        Unlock CRM Dashboard →
      </button>
      <div id="login-error" style="color: #f87171; font-size: 0.82rem; display: none;"></div>
    </form>
  </div>

  <div id="crm-main" style="display: none;">
    <nav class="crm-nav">
      <div style="display: flex; align-items: center; gap: 18px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <strong>⚡ AGNTCon 2026 Admin</strong>
          <span style="font-size: 0.75rem; background: var(--bg-secondary); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-secondary);">Operator Console</span>
        </div>
        <div class="admin-nav-tabs">
          <button id="nav-tab-crm" class="admin-nav-tab active" onclick="switchAdminView('crm')">💼 Inquiries (CRM)</button>
          <button id="nav-tab-analytics" class="admin-nav-tab" onclick="switchAdminView('analytics')">📊 Analytics</button>
        </div>
      </div>
      <div>
        <a href="/" class="btn-header" style="text-decoration: none; font-size: 0.8rem; margin-right: 8px;">Back to Web Hub</a>
        <button id="admin-logout-btn" class="btn-header" style="font-size: 0.8rem;">Logout</button>
      </div>
    </nav>

    <div id="crm-inbox-view" class="crm-layout">
      <!-- Left: Inbox Stream -->
      <aside class="crm-sidebar">
        <div class="crm-inbox-header">
          <input type="text" id="crm-search" class="search-input" placeholder="Filter by name, email, or ref..." style="padding: 6px 10px; font-size: 0.85rem;">
          <div class="crm-tabs">
            <button class="crm-tab active" data-filter="all">All</button>
            <button class="crm-tab" data-filter="new">New</button>
            <button class="crm-tab" data-filter="in_progress">In Progress</button>
            <button class="crm-tab" data-filter="resolved">Resolved</button>
            <button class="crm-tab" data-filter="archived">📦 Archived</button>
          </div>
        </div>
        <div id="bulk-action-bar" style="display: none; align-items: center; justify-content: space-between; padding: 8px 14px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); font-size: 0.8rem;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="select-all-checkbox" title="Select all" onclick="toggleSelectAll(this.checked)">
            <span id="bulk-count">0 selected</span>
          </div>
          <div style="display: flex; gap: 6px;">
            <button id="btn-bulk-archive" class="btn-header" style="font-size: 0.72rem; padding: 2px 8px;" onclick="executeBulkAction('archive')">📦 Archive</button>
            <button id="btn-bulk-restore" class="btn-header" style="font-size: 0.72rem; padding: 2px 8px; display: none;" onclick="executeBulkAction('restore')">♻️ Restore</button>
            <button id="btn-bulk-delete" class="btn-header" style="font-size: 0.72rem; padding: 2px 8px; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #ef4444; display: none;" onclick="executeBulkAction('delete')">🗑️ Delete</button>
          </div>
        </div>
        <ul id="crm-inbox-list" class="crm-list">
          <li style="padding: 20px; text-align: center; color: var(--text-secondary);">Loading inquiries...</li>
        </ul>
      </aside>

      <!-- Right: Dialogue Thread & Actions -->
      <section id="crm-thread" class="crm-thread-pane">
        <div style="padding: 60px; text-align: center; color: var(--text-secondary); margin: auto;">
          Select an inquiry from the inbox to inspect messages and reply.
        </div>
      </section>
    </div>

    <!-- Analytics Dashboard View -->
    <div id="analytics-view" class="analytics-view" style="display: none;">
      <div id="analytics-content">
        <div style="padding: 60px; text-align: center; color: var(--text-secondary);">Loading analytics...</div>
      </div>
    </div>
  </div>

  <script>
    let ACTIVE_TICKET_ID = null;
    let ALL_INQUIRIES = [];
    let CURRENT_STATUS_FILTER = "all";
    let SELECTED_IDS = new Set();

    const loginSec = document.getElementById("login-section");
    const crmMain = document.getElementById("crm-main");
    const loginForm = document.getElementById("admin-login-form");
    const loginErr = document.getElementById("login-error");
    const inboxList = document.getElementById("crm-inbox-list");
    const threadPane = document.getElementById("crm-thread");

    // Check existing session
    const savedToken = localStorage.getItem("agntcon_admin_token");
    if (savedToken) {
      loadCRM();
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pass = document.getElementById("admin-pass").value;
      loginErr.style.display = "none";
      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pass })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem("agntcon_admin_token", data.token);
          loadCRM();
        } else {
          loginErr.textContent = data.error || "Invalid operator password.";
          loginErr.style.display = "block";
        }
      } catch (err) {
        loginErr.textContent = "Connection error to /api/admin/login.";
        loginErr.style.display = "block";
      }
    });

    document.getElementById("admin-logout-btn").addEventListener("click", () => {
      localStorage.removeItem("agntcon_admin_token");
      location.reload();
    });

    async function loadCRM() {
      loginSec.style.display = "none";
      crmMain.style.display = "block";
      await fetchInquiries();
    }

    async function fetchInquiries() {
      const token = localStorage.getItem("agntcon_admin_token");
      try {
        const url = CURRENT_STATUS_FILTER === "archived" ? "/api/admin/inquiries?status=archived" : "/api/admin/inquiries";
        const res = await fetch(url, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.status === 401) {
          localStorage.removeItem("agntcon_admin_token");
          location.reload();
          return;
        }
        ALL_INQUIRIES = await res.json();
        SELECTED_IDS.clear();
        updateBulkBar();
        renderInbox();
      } catch (err) {
        inboxList.innerHTML = `<li style="padding: 20px; color: #f87171;">Failed to load inquiries.</li>`;
      }
    }

    function renderInbox() {
      const q = (document.getElementById("crm-search").value || "").toLowerCase().trim();
      let filtered = ALL_INQUIRIES.filter(inq => {
        if (CURRENT_STATUS_FILTER !== "all" && CURRENT_STATUS_FILTER !== "archived" && inq.status !== CURRENT_STATUS_FILTER) return false;
        if (CURRENT_STATUS_FILTER === "archived" && inq.status !== "archived") return false;
        if (!q) return true;
        return `${inq.id} ${inq.name} ${inq.email} ${inq.organization} ${inq.type} ${inq.title}`.toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        inboxList.innerHTML = `<li style="padding: 20px; text-align: center; color: var(--text-secondary);">No inquiries in this folder.</li>`;
        return;
      }

      inboxList.innerHTML = filtered.map(inq => {
        const isSelected = inq.id === ACTIVE_TICKET_ID;
        const isChecked = SELECTED_IDS.has(inq.id);
        const typeEmoji = inq.type === 'speaker_dispute' || inq.type === 'Correction' ? '🚨' : '💼';
        return `
          <li class="crm-card ${isSelected ? 'selected' : ''}" onclick="selectInquiry('${inq.id}')">
            <div style="display: flex; align-items: flex-start; gap: 10px;">
              <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect('${inq.id}');" style="margin-top: 3px; cursor: pointer;">
              <div style="flex: 1;">
                <div class="crm-card-title">
                  <span>${typeEmoji} ${inq.name}</span>
                  <span style="font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; background: var(--bg-secondary); border: 1px solid var(--border);">${inq.status}</span>
                </div>
                <div class="crm-card-meta">
                  <span>#${inq.id}</span>
                  <span>•</span>
                  <span>${inq.organization || inq.type}</span>
                </div>
              </div>
            </div>
          </li>
        `;
      }).join("");
    }

    function toggleSelect(id) {
      if (SELECTED_IDS.has(id)) {
        SELECTED_IDS.delete(id);
      } else {
        SELECTED_IDS.add(id);
      }
      updateBulkBar();
      renderInbox();
    }

    function toggleSelectAll(checked) {
      if (checked) {
        ALL_INQUIRIES.forEach(i => SELECTED_IDS.add(i.id));
      } else {
        SELECTED_IDS.clear();
      }
      updateBulkBar();
      renderInbox();
    }

    function updateBulkBar() {
      const bar = document.getElementById("bulk-action-bar");
      const countEl = document.getElementById("bulk-count");
      const btnArch = document.getElementById("btn-bulk-archive");
      const btnRest = document.getElementById("btn-bulk-restore");
      const btnDel = document.getElementById("btn-bulk-delete");
      const selectAll = document.getElementById("select-all-checkbox");

      if (SELECTED_IDS.size > 0) {
        bar.style.display = "flex";
        countEl.textContent = `${SELECTED_IDS.size} selected`;
        selectAll.checked = SELECTED_IDS.size === ALL_INQUIRIES.length && ALL_INQUIRIES.length > 0;

        if (CURRENT_STATUS_FILTER === "archived") {
          btnArch.style.display = "none";
          btnRest.style.display = "inline-block";
          btnDel.style.display = "inline-block";
        } else {
          btnArch.style.display = "inline-block";
          btnRest.style.display = "none";
          btnDel.style.display = "none";
        }
      } else {
        bar.style.display = "none";
        selectAll.checked = false;
      }
    }

    async function executeBulkAction(action) {
      const ids = Array.from(SELECTED_IDS);
      if (ids.length === 0) return;

      if (action === "delete") {
        if (!confirm(`Are you sure you want to permanently delete ${ids.length} inquiry(s)? This action cannot be undone.`)) {
          return;
        }
      }

      const token = localStorage.getItem("agntcon_admin_token");
      try {
        const res = await fetch("/api/admin/inquiries/bulk-action", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ action: action, ids: ids })
        });
        if (res.ok) {
          SELECTED_IDS.clear();
          if (ids.includes(ACTIVE_TICKET_ID)) {
            ACTIVE_TICKET_ID = null;
            threadPane.innerHTML = `<div style="padding: 60px; text-align: center; color: var(--text-secondary); margin: auto;">Select an inquiry from the inbox to inspect messages and reply.</div>`;
          }
          await fetchInquiries();
        } else {
          alert("Bulk action failed.");
        }
      } catch (err) {
        alert("Connection error during bulk action.");
      }
    }

    async function selectInquiry(id) {
      ACTIVE_TICKET_ID = id;
      renderInbox();
      threadPane.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--text-secondary);">Loading thread #${id}...</div>`;

      const token = localStorage.getItem("agntcon_admin_token");
      try {
        const res = await fetch(`/api/admin/inquiries/${id}`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const inq = await res.json();
        renderThread(inq);
      } catch (err) {
        threadPane.innerHTML = `<div style="padding: 40px; color: #f87171;">Failed to load thread details.</div>`;
      }
    }

    function renderThread(inq) {
      const messagesHtml = (inq.messages || []).map(m => {
        let cls = "msg-client";
        if (m.is_internal_note) cls = "msg-note";
        else if (m.sender_type === "admin") cls = "msg-admin";

        return `
          <div class="msg-bubble ${cls}">
            <div style="font-size: 0.75rem; opacity: 0.75; margin-bottom: 4px; display: flex; justify-content: space-between;">
              <strong>${m.is_internal_note ? '🔒 Internal Note' : (m.sender_type === 'admin' ? 'Operator' : inq.name)}</strong>
              <span>${m.created_at}</span>
            </div>
            <div>${m.body.replace(/\\n/g, '<br>')}</div>
          </div>
        `;
      }).join("");

      threadPane.innerHTML = `
        <div class="crm-thread-header">
          <div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <h3 style="margin: 0; font-size: 1.1rem;">#${inq.id} — ${inq.name}</h3>
              <span style="font-size: 0.75rem; background: var(--bg-secondary); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);">${inq.type}</span>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">
              Email: <a href="mailto:${inq.email}" style="color: var(--accent);">${inq.email}</a>
              ${inq.organization ? ` | Org: <strong>${inq.organization}</strong>` : ''}
              ${inq.profile_url ? ` | <a href="${inq.profile_url}" target="_blank" rel="noopener" style="color: var(--accent);">Profile ↗</a>` : ''}
              ${inq.session_id ? ` | Session: <a href="/#/session/${inq.session_id}" target="_blank" style="color: var(--accent);">[${inq.session_id}]</a>` : ''}
            </div>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            ${inq.status === 'archived' ? `
              <span style="font-size: 0.8rem; background: var(--bg-secondary); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-secondary);">Archived</span>
              <button class="btn-header" style="font-size: 0.78rem; padding: 4px 10px;" onclick="singleAction('${inq.id}', 'restore')">♻️ Restore</button>
              <button class="btn-header" style="font-size: 0.78rem; padding: 4px 10px; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #ef4444;" onclick="singleAction('${inq.id}', 'delete')">🗑️ Delete</button>
            ` : `
              <label style="font-size: 0.8rem;">Status:</label>
              <select id="thread-status-select" class="btn-header" style="padding: 4px 8px; font-size: 0.8rem;" onchange="updateStatus('${inq.id}', this.value)">
                <option value="new" ${inq.status === 'new' ? 'selected' : ''}>New</option>
                <option value="in_progress" ${inq.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                <option value="resolved" ${inq.status === 'resolved' ? 'selected' : ''}>Resolved</option>
              </select>
              <button class="btn-header" style="font-size: 0.78rem; padding: 4px 10px;" onclick="singleAction('${inq.id}', 'archive')">📦 Archive</button>
            `}
          </div>
        </div>

        <div class="crm-messages" id="thread-messages-box">
          ${messagesHtml}
        </div>

        <div class="crm-composer">
          <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button type="button" class="btn-collab-starter" onclick="insertCanned('Thank you for reaching out! We have updated the presentation summary on the live hub as requested.')">✓ Updated Summary</button>
            <button type="button" class="btn-collab-starter" onclick="insertCanned('Hi! Thanks for your inquiry. Let\\'s schedule a 15-minute call to discuss your enterprise requirements.')">📅 Schedule Call</button>
            <button type="button" class="btn-collab-starter" onclick="insertCanned('Acknowledged. Our engineering team is reviewing this request.')">⏳ Under Review</button>
          </div>
          <textarea id="composer-text" class="search-input" rows="3" style="padding: 8px 12px; resize: vertical;" placeholder="Type reply to client or add internal note..."></textarea>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label style="font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; cursor: pointer;">
              <input type="checkbox" id="composer-is-note">
              <span>Post as Private Internal Note (Hidden from client)</span>
            </label>
            <div style="display: flex; gap: 8px;">
              <button class="btn-header" onclick="submitReply('${inq.id}', false)">Send Reply</button>
              <button class="btn-header" style="background: var(--accent); color: #0b0f19; font-weight: 600;" onclick="submitReply('${inq.id}', true)">Send & Resolve</button>
            </div>
          </div>
        </div>
      `;
      const msgBox = document.getElementById("thread-messages-box");
      if (msgBox) msgBox.scrollTop = msgBox.scrollHeight;
    }

    function insertCanned(text) {
      const area = document.getElementById("composer-text");
      if (area) {
        area.value = text;
        area.focus();
      }
    }

    async function submitReply(inquiryId, markResolved) {
      const area = document.getElementById("composer-text");
      const isNote = document.getElementById("composer-is-note").checked;
      const text = (area.value || "").trim();
      if (!text) return;

      const token = localStorage.getItem("agntcon_admin_token");
      const newStatus = markResolved ? "resolved" : "in_progress";

      try {
        const res = await fetch(`/api/admin/inquiries/${inquiryId}/reply`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ body: text, is_note: isNote, new_status: newStatus })
        });
        if (res.ok) {
          selectInquiry(inquiryId);
          fetchInquiries();
        }
      } catch (err) {
        alert("Error sending reply.");
      }
    }

    async function singleAction(inquiryId, action) {
      if (action === "delete") {
        if (!confirm(`Are you sure you want to permanently delete ticket #${inquiryId}? This action cannot be undone.`)) return;
      }
      const token = localStorage.getItem("agntcon_admin_token");
      try {
        const res = await fetch("/api/admin/inquiries/bulk-action", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ action: action, ids: [inquiryId] })
        });
        if (res.ok) {
          if (action === "delete" || action === "archive") {
            ACTIVE_TICKET_ID = null;
            threadPane.innerHTML = `<div style="padding: 60px; text-align: center; color: var(--text-secondary); margin: auto;">Ticket #${inquiryId} was ${action}d. Select an inquiry from the inbox.</div>`;
          } else {
            selectInquiry(inquiryId);
          }
          await fetchInquiries();
        }
      } catch (err) {
        alert("Action failed.");
      }
    }

    async function updateStatus(inquiryId, newStatus) {
      const token = localStorage.getItem("agntcon_admin_token");
      try {
        await fetch(`/api/admin/inquiries/${inquiryId}/reply`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ body: `Status updated to ${newStatus}`, is_note: true, new_status: newStatus })
        });
        fetchInquiries();
      } catch (err) {}
    }

    document.querySelectorAll(".crm-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".crm-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        CURRENT_STATUS_FILTER = tab.getAttribute("data-filter");
        fetchInquiries();
      });
    });

    document.getElementById("crm-search").addEventListener("input", renderInbox);

    // ── Operator Analytics Controller ────────────────────────────────────────
    function getCountryFlag(cc) {
      if (!cc || cc === "XX" || cc.length !== 2) return "🌐";
      try {
        const codePoints = cc.toUpperCase().split("").map(c => 127397 + c.charCodeAt(0));
        return String.fromCodePoint(...codePoints);
      } catch (e) {
        return "🌐";
      }
    }

    function switchAdminView(view) {
      const crmTab = document.getElementById("nav-tab-crm");
      const analyticsTab = document.getElementById("nav-tab-analytics");
      const crmLayout = document.getElementById("crm-inbox-view");
      const analyticsLayout = document.getElementById("analytics-view");

      if (view === "analytics") {
        crmTab.classList.remove("active");
        analyticsTab.classList.add("active");
        crmLayout.style.display = "none";
        analyticsLayout.style.display = "block";
        loadAnalytics();
      } else {
        analyticsTab.classList.remove("active");
        crmTab.classList.add("active");
        analyticsLayout.style.display = "none";
        crmLayout.style.display = "grid";
      }
    }

    async function loadAnalytics() {
      const token = localStorage.getItem("agntcon_admin_token");
      const contentEl = document.getElementById("analytics-content");
      contentEl.innerHTML = `<div style="padding: 60px; text-align: center; color: var(--text-secondary);">Loading real-time engagement analytics...</div>`;

      try {
        const res = await fetch("/api/admin/analytics-summary", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.status === 401) {
          localStorage.removeItem("agntcon_admin_token");
          location.reload();
          return;
        }
        const data = await res.json();
        renderAnalytics(data);
      } catch (err) {
        contentEl.innerHTML = `<div style="padding: 40px; color: #f87171; text-align: center;">Failed to load analytics: ${err.message}</div>`;
      }
    }

    function renderAnalytics(data) {
      const kpis = data.kpis || {};
      const funnel = data.conversion_funnel || [];
      const geo = data.geo_distribution || [];
      const talks = data.top_talks || [];
      const searches = data.top_searches || [];
      const hourly = data.hourly_activity || [];
      const maxHourly = Math.max(...hourly.map(h => h.count), 1);

      const funnelHtml = funnel.map(f => `
        <div class="funnel-step">
          <div class="funnel-meta">
            <strong>${f.stage}</strong>
            <span style="color: var(--text-secondary);">${f.count} (${f.percent}%)</span>
          </div>
          <div class="funnel-bar-bg">
            <div class="funnel-bar-fill" style="width: ${Math.min(Math.max(f.percent, 1), 100)}%;"></div>
          </div>
        </div>
      `).join("");

      const geoHtml = geo.length > 0 ? `
        <table class="geo-table">
          <thead>
            <tr>
              <th>Country</th>
              <th style="text-align: right;">Unique Visitors</th>
              <th style="text-align: right;">Events</th>
              <th style="width: 25%;">Share</th>
            </tr>
          </thead>
          <tbody>
            ${geo.map(g => `
              <tr>
                <td>
                  <span style="font-size: 1.1rem; margin-right: 6px;">${getCountryFlag(g.country)}</span>
                  <strong>${g.country}</strong>
                </td>
                <td style="text-align: right; font-weight: 600;">${g.visitors}</td>
                <td style="text-align: right; color: var(--text-secondary);">${g.events}</td>
                <td>
                  <div class="geo-bar-wrap">
                    <div class="geo-bar" style="width: ${g.percent}%;"></div>
                  </div>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      ` : `<div style="padding: 24px; text-align: center; color: var(--text-secondary);">No geodistribution data yet.</div>`;

      const talksHtml = talks.length > 0 ? talks.map((t, i) => `
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.88rem;">
          <div style="display: flex; align-items: center; gap: 10px; overflow: hidden; padding-right: 12px;">
            <span style="font-weight: 700; color: var(--text-secondary); width: 20px;">#${i + 1}</span>
            <a href="/#/session/${t.talk_id}" target="_blank" style="color: var(--accent); font-weight: 700; text-decoration: none;">[${t.talk_id}]</a>
            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${t.title}">${t.title}</span>
          </div>
          <div style="font-weight: 700; background: var(--bg-secondary); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; font-size: 0.78rem; white-space: nowrap;">
            ${t.count} views
          </div>
        </div>
      `).join("") : `<div style="padding: 24px; text-align: center; color: var(--text-secondary);">No talk clicks recorded yet.</div>`;

      const searchesHtml = searches.length > 0 ? searches.map((s, i) => `
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.88rem;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-weight: 700; color: var(--text-secondary); width: 20px;">#${i + 1}</span>
            <code>${s.query}</code>
          </div>
          <span style="color: var(--text-secondary); font-size: 0.8rem;">${s.count} searches</span>
        </div>
      `).join("") : `<div style="padding: 24px; text-align: center; color: var(--text-secondary);">No searches recorded yet.</div>`;

      const histHtml = hourly.map(h => {
        const pct = Math.max((h.count / maxHourly) * 100, 4);
        return `
          <div class="hist-col" title="${h.date_hour}: ${h.count} events">
            <div class="hist-bar" style="height: ${pct}%;"></div>
            <div class="hist-label">${h.hour}</div>
          </div>
        `;
      }).join("");

      document.getElementById("analytics-content").innerHTML = `
        <div class="analytics-header">
          <div>
            <h2 style="margin: 0; font-size: 1.3rem;">📊 Zero-PII Engagement Analytics & Telemetry</h2>
            <p style="margin: 4px 0 0 0; font-size: 0.82rem; color: var(--text-secondary);">
              Real-time visitor telemetry, conversion funnels, and geodistribution via Cloudflare Edge.
            </p>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 0.75rem; color: var(--text-secondary);">Updated: ${data.generated_at}</span>
            <button class="btn-header" style="font-size: 0.8rem; padding: 6px 12px;" onclick="loadAnalytics()">🔄 Refresh</button>
          </div>
        </div>

        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">👥 Unique Visitors</div>
            <div class="kpi-value">${kpis.unique_visitors_24h || 0}</div>
            <div class="kpi-sub">${kpis.unique_visitors_all || 0} all-time unique visitors</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">⚡ Engaged Actions</div>
            <div class="kpi-value">${kpis.engaged_actions || 0}</div>
            <div class="kpi-sub">${kpis.total_events || 0} total telemetry events</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">📦 Second-Brain Exports</div>
            <div class="kpi-value">${kpis.exports_count || 0}</div>
            <div class="kpi-sub">Obsidian .zip + Single PDF dossiers</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">💬 AI Assistant Queries</div>
            <div class="kpi-value">${kpis.chat_queries_count || 0}</div>
            <div class="kpi-sub">Cloud + BYOM conference inquiries</div>
          </div>
        </div>

        <div class="analytics-grid-2">
          <div class="analytics-panel">
            <div class="panel-title">
              <span>🎯 Engagement Conversion Funnel</span>
              <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: normal;">Visits → Action</span>
            </div>
            ${funnelHtml}
          </div>

          <div class="analytics-panel">
            <div class="panel-title">
              <span>🌍 Visitor Geodistribution</span>
              <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: normal;">CF-IPCountry</span>
            </div>
            ${geoHtml}
          </div>
        </div>

        <div class="analytics-grid-2">
          <div class="analytics-panel">
            <div class="panel-title">
              <span>📖 Top Clicked Presentations</span>
              <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: normal;">Essence Modal Opens</span>
            </div>
            ${talksHtml}
          </div>

          <div class="analytics-panel">
            <div class="panel-title">
              <span>🔍 Top Searched Terms</span>
              <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: normal;">Conference Search</span>
            </div>
            ${searchesHtml}
          </div>
        </div>

        <div class="analytics-panel">
          <div class="panel-title">
            <span>📈 24-Hour Telemetry Volume (Hourly Buckets)</span>
            <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: normal;">Last 24 Hours (UTC)</span>
          </div>
          <div class="histogram-wrap">
            ${histHtml}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
